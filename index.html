<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetaGallery - 3D Art Gallery</title>
    <link rel="stylesheet" href="./src/styles/style.css">
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui-overlay">
        <div id="info-panel">
            <h2 id="artwork-title">Welcome to MetaGallery</h2>
            <p id="artwork-description">Use WASD to move, mouse to look around, click to lock pointer</p>
        </div>
        <div id="controls-info">
            <p><strong>Controls:</strong> W/A/S/D to move | Mouse to look | Click to lock pointer</p>
        </div>
    </div>
    <script type="module" src="./src/js/main.js"></script>
</body>
</html>
